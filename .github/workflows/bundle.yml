name: Linux Bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag (empty builds the selected ref)
        type: string
        default: ''
      attach:
        description: Attach to the existing published Release
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: bundles-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test release bundles
    uses: ./.github/workflows/bundle-test.yml
    with:
      release_tag: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
      verify_release: ${{ github.event_name == 'release' || inputs.attach == true }}

  attach:
    name: Attach complete verified asset set
    needs: verify
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.attach)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-bundle-*
          path: temp/dist
          merge-multiple: true
      - name: Verify and attach archives and SHA256SUMS
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./versions.env
          test "$RELEASE_TAG" = "v$IMAGE_VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          (cd temp/dist && sha256sum "openvpn-server-$IMAGE_VERSION-linux-amd64.tar.gz" "openvpn-server-$IMAGE_VERSION-linux-arm64.tar.gz" > SHA256SUMS)
          python3 scripts/release-bundle-assets.py --directory temp/dist --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
